<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz de Otorrinolaringologia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Chosen Palette: Calm Harmony -->
    <!-- Application Structure Plan: The application follows a logical, multi-screen flow for an optimal user experience. 1) A 'Start Screen' introduces the quiz, collects the user's name, and provides a clear entry point. 2) The 'Quiz Screen' presents one question at a time to focus the user, featuring a progress indicator and a 60-minute timer. 3) The 'Results Screen' gives immediate feedback upon completion, displays the user's name, and offers a print option for permanent record. 4) A 'Review Screen' fulfills the crucial educational goal by allowing users to analyze their incorrect answers with detailed explanations. This structured, sequential approach guides the user from introduction to active learning and reflection, which is the most effective way to present a test-based application. -->
    <!-- Visualization & Content Choices: 
        - Report Info: 50 medical MCQs. Goal: Knowledge Assessment & Learning. Viz/Presentation Method: Sequential single-question view. Interaction: Click to select answer, button to advance. Justification: Prevents cognitive overload, mimics a real test environment.
        - Report Info: Final score. Goal: Performance Summary. Viz/Presentation Method: Donut Chart. Interaction: None (static view). Justification: Provides an immediate, intuitive visual breakdown of correct vs. incorrect answers. Library/Method: Chart.js.
        - Report Info: Incorrect answers and explanations. Goal: Education/Review. Viz/Presentation Method: List of questions with user's answer, correct answer, and explanation clearly highlighted. Interaction: Scroll to review. Justification: This is the most direct and effective way to facilitate learning from mistakes.
    -->
    <!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .option-btn {
            transition: background-color 0.2s, border-color 0.2s;
        }
        .selected {
            background-color: #0891b2 !important;
            color: white !important;
            border-color: #0e7490 !important;
        }
        .correct {
            background-color: #dcfce7;
            border-color: #22c55e;
            color: #166534;
        }
        .incorrect {
            background-color: #fee2e2;
            border-color: #ef4444;
            color: #991b1b;
        }
        @media print {
            body * {
                visibility: hidden;
            }
            #results-screen, #results-screen * {
                visibility: visible;
            }
            #results-screen {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                box-shadow: none;
                background-color: white;
            }
            .chart-container {
                page-break-after: avoid;
            }
            #review-btn, #retry-btn, #print-btn {
                display: none;
            }
            #user-name-input {
                /* Esconder o input na impressão */
                display: none;
            }
        }
    </style>
</head>
<body class="bg-amber-50 text-gray-800 flex items-center justify-center min-h-screen p-4">

    <div id="app-container" class="w-full max-w-3xl mx-auto">

        <!-- Start Screen -->
        <div id="start-screen" class="text-center bg-white p-8 rounded-xl shadow-lg">

            <p class="text-gray-600 mb-6">Teste seus conhecimentos em 50 questões sobre anatomia, epistaxe e cirurgia nasossinusal. Você terá <span class="font-semibold text-cyan-600">60 minutos</span> para completar o quiz.</p>
            
            <!-- Campo para o Nome do Usuário -->
            <div class="mb-8">

            </div>

            <button id="start-btn" class="bg-cyan-600 text-white font-bold py-3 px-8 rounded-lg shadow-md hover:bg-cyan-700 transition-transform transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:ring-opacity-50">
                Iniciar Quiz

        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="hidden bg-white p-6 md:p-8 rounded-xl shadow-lg">
            <div class="flex justify-between items-center mb-6">

                <div id="timer" class="text-sm font-bold text-cyan-700 bg-cyan-100 px-3 py-1 rounded-full"></div>
            </div>
            <div id="progress-bar-container" class="w-full bg-gray-200 rounded-full h-2.5 mb-6">
                <div id="progress-bar" class="bg-cyan-600 h-2.5 rounded-full" style="width: 0%"></div>
            </div>
            <h2 id="question-text" class="text-xl md:text-2xl font-semibold mb-6"></h2>
            <div id="options-container" class="space-y-4"></div>
            <div class="mt-8 text-right">
                <button id="next-btn" class="bg-cyan-600 text-white font-bold py-2 px-6 rounded-lg shadow-md hover:bg-cyan-700 transition disabled:bg-gray-400 disabled:cursor-not-allowed">Próxima</button>
            </div>
        </div>

        <!-- Results Screen -->
        <div id="results-screen" class="hidden text-center bg-white p-8 rounded-xl shadow-lg">
            <h1 class="text-3xl md:text-4xl font-bold text-cyan-800 mb-2">Resultado Final</h1>
            <!-- Mensagem de saudação com o nome do usuário -->
            <p id="user-greeting" class="text-xl font-medium text-cyan-700 mb-4"></p> 
            <p id="score-text" class="text-xl text-gray-700 mb-4"></p>
            <p id="time-text" class="text-gray-600 mb-6"></p>
            <div class="chart-container relative h-64 w-64 md:h-72 md:w-72 mx-auto mb-8">
                <canvas id="results-chart"></canvas>
            </div>
            <div class="flex flex-col sm:flex-row justify-center gap-4">
                <button id="review-btn" class="bg-amber-500 text-white font-bold py-3 px-6 rounded-lg shadow-md hover:bg-amber-600 transition">Revisar Erros</button>
                <button id="retry-btn" class="bg-cyan-600 text-white font-bold py-3 px-6 rounded-lg shadow-md hover:bg-cyan-700 transition">Tentar Novamente</button>
                <!-- Botão de Imprimir Resultado -->
                <button id="print-btn" class="bg-gray-600 text-white font-bold py-3 px-6 rounded-lg shadow-md hover:bg-gray-700 transition">Imprimir Resultado</button>
            </div>
        </div>
        
        <!-- Review Screen -->
        <div id="review-screen" class="hidden bg-white p-6 md:p-8 rounded-xl shadow-lg">
            <h1 class="text-3xl font-bold text-cyan-800 mb-6 text-center">Revisão dos Erros</h1>
            <div id="review-container" class="space-y-8"></div>
            <div class="mt-8 text-center">
                 <button id="back-to-results-btn" class="bg-cyan-600 text-white font-bold py-3 px-6 rounded-lg shadow-md hover:bg-cyan-700 transition">Voltar ao Resultado</button>
            </div>
        </div>

    </div>

        const startScreen = document.getElementById('start-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultsScreen = document.getElementById('results-screen');
        const reviewScreen = document.getElementById('review-screen');

        const startBtn = document.getElementById('start-btn');
        const nextBtn = document.getElementById('next-btn');
        const retryBtn = document.getElementById('retry-btn');
        const reviewBtn = document.getElementById('review-btn');
        const printBtn = document.getElementById('print-btn'); 
        const backToResultsBtn = document.getElementById('back-to-results-btn');

        const questionCounter = document.getElementById('question-counter');
        const timerEl = document.getElementById('timer');
        const progressBar = document.getElementById('progress-bar');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const scoreText = document.getElementById('score-text');
        const timeText = document.getElementById('time-text');
        const reviewContainer = document.getElementById('review-container');
        const userGreetingEl = document.getElementById('user-greeting'); 

        let currentQuestionIndex = 0;
        let score = 0;
        let userAnswers = [];
        let timer;
        const totalTime = 60 * 60; // Alterado para 60 minutos (3600 segundos)
        let timeRemaining = totalTime;
        let userName = ''; 

        function startQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            userAnswers = [];
            timeRemaining = totalTime;
            
            // Obtém e armazena o nome do usuário
            const nameInput = document.getElementById('user-name-input').value.trim();
            userName = nameInput || 'Convidado(a)';

            startScreen.classList.add('hidden');
            resultsScreen.classList.add('hidden');
            reviewScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            
            loadQuestion();
            startTimer();
        }

        function startTimer() {
            // Limpa o timer anterior se existir
            if (timer) clearInterval(timer); 

            timer = setInterval(() => {
                timeRemaining--;
                const minutes = Math.floor(timeRemaining / 60);
                const seconds = timeRemaining % 60;
                timerEl.textContent = `Tempo: ${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                
                if (timeRemaining <= 0) {
                    clearInterval(timer);
                    endQuiz();
                }
            }, 1000);
        }

        function loadQuestion() {
            if (currentQuestionIndex >= quizData.length) {
                endQuiz();
                return;
            }

            const currentQuestion = quizData[currentQuestionIndex];
            questionCounter.textContent = `Questão ${currentQuestionIndex + 1} de ${quizData.length}`;
            progressBar.style.width = `${((currentQuestionIndex + 1) / quizData.length) * 100}%`;
            questionText.textContent = currentQuestion.question;
            
            optionsContainer.innerHTML = '';
            currentQuestion.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.innerHTML = `<span class="font-bold mr-2">${String.fromCharCode(65 + index)}.</span> ${option}`;
                button.classList.add('option-btn', 'w-full', 'text-left', 'p-4', 'border-2', 'border-gray-300', 'rounded-lg', 'hover:bg-cyan-50', 'hover:border-cyan-400');
                button.dataset.index = index;
                button.onclick = () => selectAnswer(index, button);
                optionsContainer.appendChild(button);
            });
            
            nextBtn.disabled = true;
            if (currentQuestionIndex === quizData.length - 1) {
                nextBtn.textContent = 'Finalizar';
            } else {
                nextBtn.textContent = 'Próxima';
            }
        }

        function selectAnswer(index, button) {
            const buttons = optionsContainer.querySelectorAll('.option-btn');
            buttons.forEach(btn => btn.classList.remove('selected'));
            button.classList.add('selected');
            nextBtn.disabled = false;
        }

        function handleNextQuestion() {
            const selectedOption = optionsContainer.querySelector('.selected');
            if (!selectedOption) return;

            const answerIndex = parseInt(selectedOption.dataset.index);
            const currentQuestion = quizData[currentQuestionIndex];

            // Armazena a resposta, mesmo que a pessoa avance sem selecionar (embora o botão esteja disabled)
            userAnswers[currentQuestionIndex] = answerIndex;

            if (answerIndex === currentQuestion.correct) {
                score++;
            }

            currentQuestionIndex++;
            loadQuestion();
        }

        function endQuiz() {
            clearInterval(timer);
            quizScreen.classList.add('hidden');
            resultsScreen.classList.remove('hidden');
            showResults();
        }

        function showResults() {
            const incorrect = quizData.length - score;
            const percentage = ((score / quizData.length) * 100).toFixed(1);
            
            // Exibe a saudação com o nome
            userGreetingEl.textContent = `Parabéns, ${userName}!`; 

            scoreText.textContent = `Você acertou ${score} de ${quizData.length} questões (${percentage}%)`;

            const timeTaken = totalTime - timeRemaining;
            const minutes = Math.floor(timeTaken / 60);
            const seconds = timeTaken % 60;
            timeText.textContent = `Tempo utilizado: ${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            const ctx = document.getElementById('results-chart').getContext('2d');
            if(window.resultsChart instanceof Chart) {
                window.resultsChart.destroy();
            }
            window.resultsChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Corretas', 'Incorretas'],
                    datasets: [{
                        data: [score, incorrect],
                        backgroundColor: ['#06b6d4', '#f59e0b'],
                        borderColor: ['#ffffff'],
                        borderWidth: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '70%',
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                font: { size: 14 }
                            }
                        }
                    }
                }
            });

            reviewBtn.disabled = incorrect === 0;
        }

        function showReview() {
            resultsScreen.classList.add('hidden');
            reviewScreen.classList.remove('hidden');
            reviewContainer.innerHTML = '';
            
            quizData.forEach((question, index) => {
                const userAnswer = userAnswers[index];
                
                // Filtra apenas as incorretas
                if (userAnswer !== undefined && userAnswer !== question.correct) {
                    const reviewBlock = document.createElement('div');
                    reviewBlock.classList.add('border-b', 'border-gray-200', 'pb-6');
                    
                    const questionTitle = document.createElement('h3');
                    questionTitle.textContent = `Questão ${index + 1}: ${question.question}`;
                    questionTitle.classList.add('font-bold', 'text-lg', 'mb-4');
                    
                    const optionsList = document.createElement('div');
                    optionsList.classList.add('space-y-2');
                    question.options.forEach((option, optIndex) => {
                        const optionP = document.createElement('p');
                        optionP.textContent = `${String.fromCharCode(65 + optIndex)}. ${option}`;
                        optionP.classList.add('p-3', 'rounded-md');

                        if (optIndex === question.correct) {
                            optionP.classList.add('correct');
                        }
                        if (optIndex === userAnswer) {
                            optionP.classList.add('incorrect');
                        }
                        optionsList.appendChild(optionP);
                    });

                    const explanationBlock = document.createElement('div');
                    explanationBlock.classList.add('mt-4', 'p-3', 'bg-amber-100', 'border-l-4', 'border-amber-500', 'text-amber-800', 'rounded-r-md');
                    explanationBlock.innerHTML = `<p><span class="font-bold">Comentário:</span> ${question.explanation}</p>`;
                    
                    reviewBlock.appendChild(questionTitle);
                    reviewBlock.appendChild(optionsList);
                    reviewBlock.appendChild(explanationBlock);
                    reviewContainer.appendChild(reviewBlock);
                }
            });
        }
        
        startBtn.addEventListener('click', startQuiz);
        nextBtn.addEventListener('click', handleNextQuestion);
        retryBtn.addEventListener('click', startQuiz);
        reviewBtn.addEventListener('click', showReview);
        backToResultsBtn.addEventListener('click', () => {
            reviewScreen.classList.add('hidden');
            resultsScreen.classList.remove('hidden');
        });
        
        // Listener para o botão de imprimir
        printBtn.addEventListener('click', () => {
            window.print();
        });

    </script>
